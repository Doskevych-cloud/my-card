<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Оплата та відвантаження</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<script>
  try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch(e){}
</script>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<script src="auth.js?v=mobhdr20260430"></script>
<script src="header.js?v=brig20260622"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/uk.js"></script>
<script src="date-range.js?v=20260522"></script>
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
a{color:inherit;text-decoration:none}

.wrap{margin:0 auto;padding:14px 16px}
.page-tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.ptab{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text2);text-decoration:none;transition:background .15s,color .15s;white-space:nowrap}
.ptab:hover{background:var(--bg3);color:var(--text)}
.ptab.active{background:var(--accent-bg);color:var(--accent)}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:10px}
.toolbar input[type=text]{flex:1;min-width:200px;padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;outline:none;transition:border .15s}
.toolbar input:focus{border-color:var(--accent)}
.toolbar .lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.toolbar .chip{padding:7px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;display:inline-flex;align-items:center;gap:6px}
.toolbar .chip:hover{background:var(--bg3);color:var(--text)}
.toolbar .chip.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
/* buttons unified via header.js (.btn + .btn--secondary/--sm) */
.toolbar .sep{width:1px;height:22px;background:var(--border);margin:0 2px}
.toolbar .group{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px;background:var(--bg2);border:1px solid var(--border);border-radius:9px}
.toolbar .group .chip{border:none;background:transparent;padding:5px 10px;border-radius:6px}
.toolbar .group .chip.active{background:var(--accent-bg);color:var(--accent)}

.toolbar .spacer{flex:1 1 auto}
.toolbar .brk{flex-basis:100%;height:0}
/* Tag-input «Пошук»/«Виключити» (як в інших звітах) */
.ar-tags{position:relative;display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 6px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;min-width:180px;max-width:360px;min-height:30px}
.ar-tags:focus-within{border-color:var(--accent)}
.ar-tags input[type=text]{flex:1;min-width:90px;padding:3px 4px;border:none;background:transparent;font-size:12px;color:var(--text);outline:none}
.ar-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 8px;background:var(--accent-bg);color:var(--accent);font-size:11px;font-weight:600;border-radius:6px;white-space:nowrap;max-width:200px}
.ar-tag .name{overflow:hidden;text-overflow:ellipsis}
.ar-tag .x{cursor:pointer;font-size:14px;line-height:1;opacity:.7;padding:0 2px}
.ar-tag .x:hover{opacity:1;color:var(--red)}
.ar-suggest{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface2);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.28);max-height:280px;overflow-y:auto;z-index:50;min-width:280px}
.ar-suggest .opt{padding:7px 12px;font-size:12px;cursor:pointer;color:var(--text);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.ar-suggest .opt:last-child{border-bottom:none}
.ar-suggest .opt:hover,.ar-suggest .opt.hl{background:var(--bg3);color:var(--accent)}
.ar-suggest .opt .meta{color:var(--text3);font-size:10.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ar-suggest .empty{padding:10px 12px;font-size:12px;color:var(--text3)}
/* Гармонія шапки: компактна дата (перебиваємо flatpickr altInput → !important),
   рядок фільтрів — «Пошук» і «Виключити» тягнуться пропорційно 2:1 до краю. */
.toolbar{row-gap:10px}
.toolbar .date-range-input{width:150px !important;flex:0 0 auto !important;min-width:0 !important;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-weight:600;text-align:center;cursor:pointer}
.toolbar #ospIncludeTags{flex:2 1 300px;max-width:none}
.toolbar #ospExcludeTags{flex:1 1 260px;max-width:none}
.ar-tag{max-width:150px}

/* OSP summary — P&L стиль: без плашок, без прогрес-барів, без акцентних кольорів на статичних даних */
.osp-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.osp-card{padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;gap:2px}
.osp-card .osp-head{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.osp-card .osp-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.osp-card .osp-pct{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.2;color:var(--text)}
.osp-card .osp-rows{display:flex;flex-direction:column;gap:4px}
.osp-card .osp-row{display:flex;justify-content:space-between;align-items:baseline}
.osp-card .osp-lbl{font-size:11px;color:var(--text3);font-weight:500}
.osp-card .osp-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text)}
.osp-card .osp-val.muted{color:var(--text3);font-weight:500}
.osp-help{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:5px;border-radius:50%;background:var(--border);color:var(--text2);font-size:9px;font-weight:700;cursor:help;position:relative;vertical-align:middle;transition:background .15s,color .15s}
.osp-help:hover{background:var(--accent);color:#fff}
.osp-help .osp-tip{visibility:hidden;opacity:0;position:absolute;bottom:calc(100% + 8px);left:0;width:250px;padding:9px 11px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;box-shadow:0 6px 22px rgba(0,0,0,.28);color:var(--text2);font-size:11px;font-weight:400;line-height:1.5;text-align:left;letter-spacing:0;text-transform:none;z-index:30;transition:opacity .15s,visibility .15s;pointer-events:none}
.osp-help .osp-tip::after{content:'';position:absolute;top:100%;left:5px;border:5px solid transparent;border-top-color:var(--border)}
.osp-help:hover .osp-tip{visibility:visible;opacity:1}
/* Іконка «?» у заголовку картки: підказка розкривається вниз (щоб не перекривати тулбар над карткою) */
.osp-help--down .osp-tip{top:calc(100% + 8px);bottom:auto}
.osp-help--down .osp-tip::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--border)}

/* Tree table */
.tree-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tree-tbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.tree-tbl thead th{padding:11px 12px;background:var(--bg2);color:var(--text3);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
.tree-tbl thead th:not(:first-child){text-align:right}
.tree-tbl thead th:nth-child(1){width:40%}
.tree-tbl thead th:nth-child(n+2){width:10%}
.tree-tbl tbody tr{transition:background .1s}
.tree-tbl tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.tree-tbl tbody td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.tree-tbl tbody td:first-child{overflow:hidden;text-overflow:ellipsis}

.tree-tbl tr.client-row{cursor:pointer;color:var(--text)}
.tree-tbl tr.client-row td{background:rgba(255,255,255,.02);font-weight:600}
:root[data-theme="light"] .tree-tbl tr.client-row td{background:rgba(0,0,0,.015)}
.tree-tbl tr.client-row:hover td{background:var(--bg3)}
.tree-tbl tr.client-row td:first-child{padding-left:38px}

.tree-tbl tr.order-row{cursor:pointer;color:var(--text2)}
.tree-tbl tr.order-row:hover td{background:var(--bg3)}
.tree-tbl tr.order-row td:first-child{padding-left:12px;font-size:11.5px}
/* Перша колонка замовлення = вирівняні підстовпці: дата · № · клієнт */
.tree-tbl .ord-cell{display:flex;align-items:baseline;gap:10px}
.tree-tbl .ord-date{flex:none;width:80px;color:var(--text3);font-variant-numeric:tabular-nums}
.tree-tbl .ord-num{flex:none;width:124px;color:var(--text2);font-weight:600}
.tree-tbl .ord-client{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-tbl thead th .ord-client,.tree-tbl thead th .ord-date,.tree-tbl thead th .ord-num{color:var(--text3)}
/* Сортувальні заголовки */
.tree-tbl thead .th-sort{cursor:pointer;user-select:none;transition:color .12s}
.tree-tbl thead .th-sort:hover{color:var(--text)}
.tree-tbl thead .th-sort .arr{font-size:8px;margin-left:3px;color:var(--accent)}
.tree-tbl tr.order-row .meta{color:var(--text3);font-size:10.5px;margin-left:8px}

.tree-tbl tr.item-row{color:var(--text2)}
.tree-tbl tr.item-row:hover td{background:var(--bg3)}
.tree-tbl tr.item-row td:first-child{padding-left:44px;font-size:11px;color:var(--text2)}
.tree-tbl tr.item-row td{font-size:11px}

.chev{display:inline-block;width:14px;color:var(--text3);transition:transform .15s;font-size:10px;transform:translateY(-1px)}
.chev.open{transform:rotate(90deg) translateY(-1px)}
.chev.hidden{visibility:hidden}

.val-neg{color:var(--red);font-weight:600}
.val-zero{color:var(--text3)}

.loading{padding:60px 20px;text-align:center;color:var(--text2);font-size:13px}
.loading::after{content:'';display:block;width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:14px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
.error{padding:20px;text-align:center;color:var(--red);background:var(--red-bg);border-radius:10px;font-size:12px;margin-top:16px}
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:12px}

@media (max-width:720px){
  .wrap{padding:12px}
  .page-tabs{display:flex;flex-wrap:wrap;gap:3px;padding:3px;max-width:100%}
  .ptab{padding:6px 10px;font-size:11.5px;flex:0 0 auto}
  .tree-wrap{-webkit-overflow-scrolling:touch}
  .toolbar{padding:8px;gap:6px;border-radius:10px}
  .toolbar input[type=text]{flex:1 1 100%;min-width:0;font-size:12px;padding:6px 8px}
  .toolbar .date-range-input{font-size:12px;padding:6px 8px}
  .toolbar .lbl{display:none}
  .toolbar .chip{padding:6px 10px;font-size:11px}
  .toolbar .group{padding:3px;gap:2px}
  .toolbar .group .chip{padding:5px 8px;font-size:11px}
  .toolbar .sep{display:none}
  .osp-summary{grid-template-columns:1fr;gap:8px}
  .osp-card{padding:11px 12px;border-radius:10px}
  .osp-card .osp-title{font-size:9.5px}
  .osp-card .osp-pct{font-size:18px}
  .osp-card .osp-val{font-size:12.5px}
  .osp-card .osp-lbl{font-size:10.5px}
  .tree-wrap{border-radius:10px}
  .tree-tbl{font-size:10.5px}
  .tree-tbl thead th,.tree-tbl tbody td{padding:6px 5px;font-size:10.5px}
  .tree-tbl thead th:nth-child(n+2){width:74px}
  .tree-tbl tr.client-row td:first-child{padding-left:24px}
  .tree-tbl tr.order-row td:first-child{padding-left:8px}
  .tree-tbl tr.item-row td:first-child{padding-left:24px}
  .tree-tbl .ord-cell{gap:6px}
  .tree-tbl .ord-date{width:58px}
  .tree-tbl .ord-num{width:88px}
}
</style>
</head>
<body>

<div id="appHeader"></div>
<div id="app">
  <div class="wrap">
    <div class="page-tabs">
      <a href="/prices.html" class="ptab" data-perm="sales_prices">🏠 Порівняння цін</a>
      <a href="/sales.html" class="ptab" data-perm="sales">📈 Продажі менеджерів</a>
      <a href="/top_products.html" class="ptab" data-perm="sales_top_products">📦 Останні продажі</a>
      <a href="/osp.html" class="ptab active" data-perm="sales_osp">📋 Оплата та відвантаження</a>
      <a href="/ar_aging.html" class="ptab" data-perm="sales_ar_aging">⏱ Заборгованість покупців</a>
      <a href="/active_clients.html" class="ptab" data-org-required="Реакт" data-perm="sales_active_clients">👥 Клієнтська база</a>
      <a href="/inventory.html" class="ptab" data-perm="sales_inventory">📊 Обіговість запасів</a>
      <a href="/sla.html" class="ptab" data-perm="sales_sla">⚡ SLA</a>
    </div>
    <div class="toolbar">
      <!-- Рядок 1: зріз (дата · організація) + керування деревом -->
      <span class="lbl">Станом на</span>
      <input type="text" id="asofDate" class="date-range-input" readonly>
      <span class="group">
        <span class="chip active" data-asof="today"        onclick="setAsofPreset('today')">Сьогодні</span>
        <span class="chip"        data-asof="prevmonthend" onclick="setAsofPreset('prevmonthend')">Кінець мин. міс.</span>
      </span>

      <span class="sep"></span>

      <span class="group">
        <span class="chip" data-org="" onclick="setOrg('')">Всі</span>
        <span class="chip active" data-org="Реакт" onclick="setOrg('Реакт')">Реакт</span>
        <span class="chip" data-org="Генерація" onclick="setOrg('Генерація')">Генерація</span>
      </span>

      <span class="spacer"></span>

      <button class="btn btn--secondary btn--sm" onclick="expandAll()">⊞ Розгорнути</button>
      <button class="btn btn--secondary btn--sm" onclick="collapseAll()">⊟ Згорнути</button>

      <span class="brk"></span>

      <!-- Рядок 2: фільтри (пошук · виключення) -->
      <span class="lbl">Пошук</span>
      <span class="ar-tags" id="ospIncludeTags">
        <input type="text" id="ospIncludeIn" placeholder="🔎 Клієнт, № замовлення, товар…" autocomplete="off">
        <div id="ospIncludeSuggest" class="ar-suggest" style="display:none"></div>
      </span>

      <span class="lbl">Виключити</span>
      <span class="ar-tags" id="ospExcludeTags">
        <input type="text" id="ospExcludeIn" placeholder="Почни вводити…" autocomplete="off">
        <div id="ospExcludeSuggest" class="ar-suggest" style="display:none"></div>
      </span>
    </div>

    <div id="curSummary"></div>
    <div id="body"><div class="loading">Завантаження…</div></div>
  </div>
</div>

<script>
const API_URL = 'https://price-api.doskevich.workers.dev';

Auth.require('sales_osp').then(user => {
  window.__user = user;
  AppHeader.mount({ active: 'sales', user });
  Auth.filterSubNav(user);
  // Org-level access: hide chips for orgs the user doesn't have access to
  // If no orgs assigned at all → show everything (no restriction)
  const userOrgs = user.orgs || {};
  const hasAnyOrg = Object.values(userOrgs).some(v => v);
  if (hasAnyOrg) {
    const allowedOrgs = ['Реакт', 'Генерація'].filter(o => userOrgs[o]);
    const orgChips = document.querySelectorAll('.chip[data-org]');
    orgChips.forEach(chip => {
      const org = chip.dataset.org;
      if (org === '') {
        if (allowedOrgs.length < 2) chip.style.display = 'none';
      } else {
        if (!userOrgs[org]) chip.style.display = 'none';
      }
    });
    const defaultOrg = allowedOrgs.length === 1 ? allowedOrgs[0] : '';
    state.org = defaultOrg;
    orgChips.forEach(c => c.classList.toggle('active', c.dataset.org === defaultOrg));
  }
  // Якщо в URL hash є from/to/org (наприклад прийшли з executive dashboard) —
  // застосовуємо їх замість дефолтного presetа.
  const hs = _readHashState();
  if (hs.asof || hs.to) {
    // asof напряму, або кінець періоду з deep-link'а (executive dashboard).
    state.asof = hs.asof || hs.to;
    if (hs.org && (!hasAnyOrg || userOrgs[hs.org])) {
      state.org = hs.org;
      document.querySelectorAll('.chip[data-org]').forEach(c => c.classList.toggle('active', c.dataset.org === state.org));
    }
  }
  detectAsofPreset();
  load();
});

function _readHashState() {
  try { return Object.fromEntries(new URLSearchParams(location.hash.slice(1))); }
  catch (_) { return {}; }
}

// ─── State ───
function _todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Внутрішні холдингові орги як «клієнти» — інтра-холдинг, не реальні покупці.
// Точні назви з counterparties.description (включно з trailing space у "Київ ").
const DEFAULT_EXCLUDES = [
  'Дистрибуція',
  'ТОВ "ГЕНЕРАЦІЯ ЕНЕРДЖІ" Киев',
  'ТОВ "ГЕНЕРАЦІЯ ЕНЕРДЖІ" Київ ',
  'ТОВ "ГЕНЕРАЦІЯ ЕНЕРДЖІ" Одеса',
];
const state = {
  data: null,
  org: 'Реакт',
  asof: _todayISO(),
  search: '',
  openKeys: new Set(),
  loading: false,
  fx: null,
  excludeList: [],
  includeList: [],
  sortKey: null,   // null = дефолт (клієнт А-Я, новіші зверху)
  sortDir: -1,
};
try {
  const ex = localStorage.getItem('osp_exclude');
  if (ex !== null) {
    const a = JSON.parse(ex);
    if (Array.isArray(a)) state.excludeList = a;
  } else {
    // Перший візит — заливаємо дефолт (інтра-холдинг) у localStorage.
    state.excludeList = DEFAULT_EXCLUDES.slice();
    localStorage.setItem('osp_exclude', JSON.stringify(state.excludeList));
  }
  const inc = localStorage.getItem('osp_include');
  if (inc) { const a = JSON.parse(inc); if (Array.isArray(a)) state.includeList = a; }
} catch (_) {}

function toUsd(amount, cur) {
  if (!isFinite(amount)) return null;
  if (cur === 'USD') return amount;
  const fx = state.fx && state.fx.rates;
  if (!fx) return null;
  if (cur === 'UAH') return fx.USD_UAH > 0 ? amount / fx.USD_UAH : null;
  if (cur === 'EUR') return (fx.EUR_UAH > 0 && fx.USD_UAH > 0) ? amount * fx.EUR_UAH / fx.USD_UAH : null;
  return null;
}

function fmt(n, dec = 2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('uk-UA', { maximumFractionDigits: dec, minimumFractionDigits: dec });
}
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

let _picker = null;
function _syncInputs() {
  if (_picker) _picker.setDate(state.asof, false);
}

async function load() {
  state.loading = true;
  _syncInputs();
  document.getElementById('curSummary').innerHTML = '';
  document.getElementById('body').innerHTML = '<div class="loading">Завантаження…</div>';
  try {
    const q = `?action=orders_shipment_payment&asof=${state.asof}&org=${encodeURIComponent(state.org)}`;
    const [mainRes, fxRes] = await Promise.all([
      fetch(API_URL + q).then(r => r.json()),
      fetch(API_URL + '?action=fx_rates').then(r => r.json()).catch(() => null),
    ]);
    if (mainRes.error) throw new Error(mainRes.error);
    state.data = mainRes;
    state.fx = (fxRes && fxRes.rates && fxRes.rates.USD_UAH) ? fxRes : null;
    state.loading = false;
    render();
  } catch (e) {
    state.loading = false;
    document.getElementById('body').innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

// ─── Controls ───
function setOrg(v) {
  state.org = v;
  document.querySelectorAll('.chip[data-org]').forEach(c => c.classList.toggle('active', c.dataset.org === v));
  load();
}
function _localISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function asofPresetDate(p) {
  const now = new Date();
  if (p === 'today') return _localISO(now);
  if (p === 'prevmonthend') return _localISO(new Date(now.getFullYear(), now.getMonth(), 0));
  return null;
}
function setAsofPreset(p) {
  const v = asofPresetDate(p); if (!v) return;
  state.asof = v;
  document.querySelectorAll('.chip[data-asof]').forEach(c => c.classList.toggle('active', c.dataset.asof === p));
  if (_picker) _picker.setDate(v, false);
  load();
}
function detectAsofPreset() {
  const chips = document.querySelectorAll('.chip[data-asof]');
  let match = null;
  for (const c of chips) { if (asofPresetDate(c.dataset.asof) === state.asof) { match = c.dataset.asof; break; } }
  chips.forEach(c => c.classList.toggle('active', c.dataset.asof === match));
}

document.addEventListener('DOMContentLoaded', () => {
  _picker = flatpickr('#asofDate', {
    locale: 'uk',
    dateFormat: 'Y-m-d',
    altInput: true,
    altFormat: 'j F Y',
    defaultDate: state.asof,
    onChange: function(sel, dateStr) {
      state.asof = dateStr;
      detectAsofPreset();
      load();
    }
  });
  // Tag-inputs «Пошук» + «Виключити»
  ['include', 'exclude'].forEach(f => {
    const inp = document.getElementById(OSP_TAG_CFG[f].inputId);
    if (!inp) return;
    inp.addEventListener('input',   () => ospTag.onInput(f));
    inp.addEventListener('focus',   () => ospTag.onInput(f));
    inp.addEventListener('blur',    () => setTimeout(() => ospTag.hide(f), 200));
    inp.addEventListener('keydown', e => ospTag.onKey(f, e));
    ospTag.renderTags(f);
  });
});

function expandAll() {
  state.openKeys.clear();
  collectKeys().forEach(k => state.openKeys.add(k));
  render();
}
function collapseAll() {
  state.openKeys.clear();
  render();
}

// Merge clients across orgs when state.org === '' (Всі). Identical client
// names are combined; orders are concatenated (each order is distinct by ref).
function getClients() {
  if (!state.data) return [];
  const byOrg = state.data.byOrg || {};
  if (state.org) return (byOrg[state.org] && byOrg[state.org].clients) || [];

  const merged = {};
  Object.values(byOrg).forEach(od => {
    (od.clients || []).forEach(c => {
      if (!merged[c.name]) merged[c.name] = { name: c.name, orders: [] };
      merged[c.name].orders.push(...(c.orders || []));
    });
  });
  return Object.values(merged);
}

// Плоский список замовлень (звіт по замовленнях, не по клієнтах). До кожного
// додаємо ім'я клієнта — окремого групуючого рядка клієнта більше немає.
function getOrders() {
  const orders = [];
  getClients().forEach(c => (c.orders || []).forEach(o => orders.push({ ...o, clientName: c.name })));
  // Замовлення одного клієнта поруч; новіші — зверху.
  return orders.sort((a, b) =>
    (a.clientName || '').localeCompare(b.clientName || '') ||
    (b.date || '').localeCompare(a.date || '')
  );
}

function collectKeys() {
  return getOrders().map(o => `o:${o.ref}`);
}

function _matchOrder(o, q) {
  if (!q) return true;
  return (o.clientName || '').toLowerCase().includes(q)
    || (o.number || '').toLowerCase().includes(q)
    || (o.items || []).some(it => (it.name || '').toLowerCase().includes(q));
}

/* Tag-inputs «Пошук» (include) та «Виключити» (exclude) з autocomplete — один
   віджет на два поля, як в ar_aging. Обидва списки живуть у localStorage.
   У «Пошук» Enter без підказки додає ВІЛЬНИЙ текст-тег (№ замовлення, товар). */
const OSP_TAG_CFG = {
  include: { stateKey: 'includeList', tagsId: 'ospIncludeTags', inputId: 'ospIncludeIn', suggestId: 'ospIncludeSuggest', storageKey: 'osp_include', freeText: true },
  exclude: { stateKey: 'excludeList', tagsId: 'ospExcludeTags', inputId: 'ospExcludeIn', suggestId: 'ospExcludeSuggest', storageKey: 'osp_exclude', freeText: false },
};
const ospTag = {
  list(f) { return state[OSP_TAG_CFG[f].stateKey] || []; },
  save(f) { try { localStorage.setItem(OSP_TAG_CFG[f].storageKey, JSON.stringify(this.list(f))); } catch (_) {} },
  renderTags(f) {
    const cfg = OSP_TAG_CFG[f];
    const host = document.getElementById(cfg.tagsId);
    if (!host) return;
    Array.from(host.querySelectorAll('.ar-tag')).forEach(n => n.remove());
    const inp = document.getElementById(cfg.inputId);
    this.list(f).forEach(name => {
      const t = document.createElement('span');
      t.className = 'ar-tag';
      t.innerHTML = '<span class="name">' + esc(name) + '</span><span class="x" data-xname="' + esc(name) + '" data-field="' + f + '">×</span>';
      host.insertBefore(t, inp);
    });
  },
  add(f, name) {
    if (!name) return;
    const cur = this.list(f);
    if (!cur.some(n => n.toLowerCase() === name.toLowerCase())) {
      state[OSP_TAG_CFG[f].stateKey] = cur.concat([name]);
      this.save(f);
    }
    const inp = document.getElementById(OSP_TAG_CFG[f].inputId);
    if (inp) inp.value = '';
    if (f === 'include') state.search = '';
    this.hide(f);
    this.renderTags(f);
    render();
  },
  remove(f, name) {
    state[OSP_TAG_CFG[f].stateKey] = this.list(f).filter(n => n !== name);
    this.save(f);
    this.renderTags(f);
    render();
  },
  hide(f) { const dd = document.getElementById(OSP_TAG_CFG[f].suggestId); if (dd) dd.style.display = 'none'; },
  allClients() {
    const seen = new Map();
    getClients().forEach(c => {
      const name = c.name || ''; if (!name) return;
      let usd = 0;
      (c.orders || []).forEach(o => { const v = toUsd(+o.amount || 0, o.currency); if (v != null) usd += v; });
      const key = name.toLowerCase();
      const prev = seen.get(key) || { name, usd: 0 };
      prev.usd += usd; seen.set(key, prev);
    });
    return [...seen.values()].sort((a, b) => b.usd - a.usd);
  },
  onInput(f) {
    const cfg = OSP_TAG_CFG[f];
    const inp = document.getElementById(cfg.inputId);
    const dd = document.getElementById(cfg.suggestId);
    if (!inp || !dd) return;
    const q = inp.value.trim().toLowerCase();
    // «Пошук»: набраний текст фільтрує таблицю наживо, ще до вибору тега.
    if (f === 'include') { state.search = q; render(); }
    const all = this.allClients();
    if (!all.length) { dd.style.display = 'none'; return; }
    const taken = new Set(this.list(f).map(n => n.toLowerCase()));
    const matched = all
      .filter(o => !taken.has((o.name || '').toLowerCase()))
      .filter(o => !q || (o.name || '').toLowerCase().includes(q))
      .slice(0, 50);
    if (!matched.length) {
      dd.innerHTML = cfg.freeText && q
        ? '<div class="empty">Enter — шукати «' + esc(inp.value.trim()) + '» як текст</div>'
        : '<div class="empty">Нічого не знайдено</div>';
      dd.style.display = 'block'; return;
    }
    dd.innerHTML = matched.map((o, i) =>
      '<div class="opt' + (i === 0 ? ' hl' : '') + '" data-optname="' + esc(o.name) + '" data-field="' + f + '">' +
        '<span>' + esc(o.name) + '</span>' +
        '<span class="meta">' + (o.usd ? '$' + fmt(o.usd, 0) : '') + '</span>' +
      '</div>').join('');
    dd.style.display = 'block';
  },
  onKey(f, ev) {
    const cfg = OSP_TAG_CFG[f];
    const dd = document.getElementById(cfg.suggestId);
    const ddOpen = dd && dd.style.display !== 'none';
    const opts = ddOpen ? Array.from(dd.querySelectorAll('.opt')) : [];
    let idx = opts.findIndex(o => o.classList.contains('hl'));
    if (ev.key === 'ArrowDown' && opts.length) { ev.preventDefault(); idx = Math.min(idx + 1, opts.length - 1); opts.forEach((o, i) => o.classList.toggle('hl', i === idx)); opts[idx]?.scrollIntoView({ block: 'nearest' }); }
    else if (ev.key === 'ArrowUp' && opts.length) { ev.preventDefault(); idx = Math.max(idx - 1, 0); opts.forEach((o, i) => o.classList.toggle('hl', i === idx)); opts[idx]?.scrollIntoView({ block: 'nearest' }); }
    else if (ev.key === 'Enter') {
      ev.preventDefault();
      const sel = opts[idx] || opts[0];
      if (sel) this.add(f, sel.dataset.optname);
      else if (cfg.freeText && ev.target.value.trim()) this.add(f, ev.target.value.trim());
    }
    else if (ev.key === 'Escape') { this.hide(f); }
    else if (ev.key === 'Backspace' && !ev.target.value && this.list(f).length) {
      this.remove(f, this.list(f)[this.list(f).length - 1]);
    }
  },
};
document.addEventListener('click', function(ev) {
  const x = ev.target.closest('.ar-tag .x[data-xname]');
  if (x) { ospTag.remove(x.dataset.field || 'exclude', x.dataset.xname); return; }
  const opt = ev.target.closest('.ar-suggest .opt[data-optname]');
  if (opt) { ospTag.add(opt.dataset.field || 'exclude', opt.dataset.optname); return; }
  const th = ev.target.closest('[data-sortkey]');
  if (th) { setSort(th.dataset.sortkey); return; }
});

/* ─── Сортування по клацанню на заголовок ───
   Перший клік: гроші/кількості — найбільше зверху (найбільший борг важливіший),
   дата — новіші зверху, клієнт/№ — за зростанням. Повторний клік — реверс. */
const SORT_DEFAULT_DIR = { date: -1, num: 1, client: 1, amount: -1, paid: -1, rempay: -1, ordered: -1, shipped: -1, remship: -1 };
function setSort(key) {
  if (state.sortKey === key) state.sortDir = -state.sortDir;
  else { state.sortKey = key; state.sortDir = SORT_DEFAULT_DIR[key] || -1; }
  render();
}
// Грошові значення порівнюємо в $ (звіт мультивалютний); без курсу — як є.
function _sortVal(o, key) {
  switch (key) {
    case 'date':    return o.date || '';
    case 'num':     { const m = (o.number || '').match(/(\d+)\s*$/); return m ? +m[1] : 0; }
    case 'client':  return (o.clientName || '').toLowerCase();
    case 'amount':  { const v = +o.amount || 0; const u = toUsd(v, o.currency); return u == null ? v : u; }
    case 'paid':    { const v = +o.paid || 0; const u = toUsd(v, o.currency); return u == null ? v : u; }
    case 'rempay':  { const v = Math.max(0, (+o.amount || 0) - (+o.paid || 0)); const u = toUsd(v, o.currency); return u == null ? v : u; }
    case 'ordered': return +o.ordered || 0;
    case 'shipped': return +o.shipped || 0;
    case 'remship': return Math.max(0, (+o.ordered || 0) - (+o.shipped || 0));
    default: return 0;
  }
}
function _sortArrow(key) {
  if (state.sortKey !== key) return '';
  return `<span class="arr">${state.sortDir > 0 ? '▲' : '▼'}</span>`;
}

// ─── Render ───
function render() {
  const exSet = new Set((state.excludeList || []).map(s => (s || '').toLowerCase()));
  // Теги «Пошук»: показуємо замовлення, що відповідає ХОЧ ОДНОМУ тегу
  // (точний збіг клієнта або підрядок у клієнті/№/товарах). Набраний, але ще
  // не доданий текст (state.search) фільтрує додатково, наживо.
  const incTags = (state.includeList || []).map(s => (s || '').toLowerCase()).filter(Boolean);
  const orders = getOrders();
  const visible = orders.filter(o => {
    if (exSet.has((o.clientName || '').toLowerCase())) return false;
    if (!_matchOrder(o, state.search)) return false;
    if (!incTags.length) return true;
    const cn = (o.clientName || '').toLowerCase();
    return incTags.some(t => cn === t || _matchOrder(o, t));
  });
  if (state.sortKey) {
    const k = state.sortKey, dir = state.sortDir;
    visible.sort((a, b) => {
      const va = _sortVal(a, k), vb = _sortVal(b, k);
      const c = (typeof va === 'string') ? va.localeCompare(vb, 'uk') : (va - vb);
      // стабільність: при рівності — за клієнтом, потім новіші зверху
      return c !== 0 ? c * dir
        : ((a.clientName || '').localeCompare(b.clientName || '', 'uk')
           || (b.date || '').localeCompare(a.date || ''));
    });
  }

  // Summary — дві ключові категорії, заради яких і є звіт-контроль:
  //  A) відвантажено, але не оплачено — товар віддали, гроші не отримали (борг клієнта);
  //  B) оплачено, але не відвантажено — гроші взяли, товар ще винні (передоплата).
  // Категорії можуть перетинатись (часткова оплата І часткове відвантаження).
  let okCur = !!state.fx;
  let aCount = 0, aDebt = 0;    // A: відвантажено, не оплачено (кількість — лише для кольору)
  let bCount = 0, bPrepaid = 0; // B: оплачено, не відвантажено
  visible.forEach(o => {
    const amount = +o.amount || 0, paid = +o.paid || 0;
    const ordered = +o.ordered || 0, shipped = +o.shipped || 0;
    const remPay = Math.max(0, amount - paid);
    const remShip = Math.max(0, ordered - shipped);
    if (shipped > 0 && remPay > 0.01) {            // є відвантаження + несплачений залишок
      aCount++;
      const d = toUsd(remPay, o.currency);
      if (d == null) okCur = false; else aDebt += d;
    }
    if (paid > 0.01 && remShip > 0) {              // є оплата + недовідвантаження
      bCount++;
      const p = toUsd(paid, o.currency);
      if (p == null) okCur = false; else bPrepaid += p;
    }
  });
  const $ = v => okCur ? '$' + fmt(v) : '—';

  document.getElementById('curSummary').innerHTML = `
    <div class="osp-summary">
      <div class="osp-card">
        <div class="osp-head">
          <span class="osp-title">Відвантажено, не оплачено<span class="osp-help osp-help--down">?<span class="osp-tip">Борг <b>ПО ЗАМОВЛЕННЮ</b>: несплачений залишок до повної суми замовлення, якщо по ньому вже було відвантаження (повне або часткове). Контролюємо виконання угоди — скільки клієнт має доплатити.<br><br>Відрізняється від «Заборгованості покупців»: там борг лише за <b>фактично відвантажене</b> (з заліком авансів по договору). Тому при часткових відвантаженнях тут сума більша — рахуємо й ще не відвантажену частину замовлення.</span></span></span>
          <span class="osp-pct" style="color:${aCount ? 'var(--red)' : 'var(--text3)'}">${$(aDebt)}</span>
        </div>
      </div>
      <div class="osp-card">
        <div class="osp-head">
          <span class="osp-title">Оплачено, не відвантажено<span class="osp-help osp-help--down">?<span class="osp-tip">Отримані кошти <b>ПО ЗАМОВЛЕННЯХ</b>, які ще не відвантажені повністю: передоплата — наш обов'язок довезти товар.<br><br>Кожне замовлення рахується окремо: передоплата тут НЕ гаситься боргом того ж клієнта по іншому замовленню (на відміну від «Заборгованості покупців», де аванси й борги неттяться по договору).</span></span></span>
          <span class="osp-pct" style="color:${bCount ? 'var(--text)' : 'var(--text3)'}">${$(bPrepaid)}</span>
        </div>
      </div>
    </div>`;

  if (!visible.length) {
    document.getElementById('body').innerHTML = '<div class="empty">Немає замовлень для контролю станом на цю дату 🎉</div>';
    return;
  }

  // Рядки — по замовленнях (без групуючого рядка клієнта).
  // Колір залишку: недоплата червона лише якщо вже відвантажено; недовідвантаження
  // червоне лише якщо була оплата (інакше залишок очікуваний → звичайний колір).
  const cur = c => `<span style="color:var(--text3);font-size:10px">${esc(c)}</span>`;
  const rows = [];
  visible.forEach(o => {
    const ok = `o:${o.ref}`;
    const isOpen = state.openKeys.has(ok);
    const oRem = Math.max(0, (+o.amount || 0) - (+o.paid || 0));
    const oRemShip = Math.max(0, (+o.ordered || 0) - (+o.shipped || 0));
    const oRemCls = oRem <= 0.001 ? 'val-zero' : ((+o.shipped || 0) > 0 ? 'val-neg' : '');
    const oShipCls = oRemShip <= 0 ? 'val-zero' : ((+o.paid || 0) > 0.001 ? 'val-neg' : '');
    const hasItems = (o.items || []).length > 0;
    rows.push(`
      <tr class="order-row" data-key="${esc(ok)}">
        <td><span class="ord-cell"><span class="chev ${isOpen?'open':''} ${hasItems?'':'hidden'}">▶</span><span class="ord-date">${fmtDate(o.date)}</span><span class="ord-num">№${esc(o.number || '?')}</span><span class="ord-client">${esc(o.clientName || '')}</span></span></td>
        <td>${fmt(o.amount)} ${cur(o.currency)}</td>
        <td>${fmt(o.paid)} ${cur(o.currency)}</td>
        <td class="${oRemCls}">${fmt(oRem)} ${cur(o.currency)}</td>
        <td>${fmt(o.ordered, 0)}</td>
        <td>${fmt(o.shipped, 0)}</td>
        <td class="${oShipCls}">${fmt(oRemShip, 0)}</td>
      </tr>`);
    if (!isOpen) return;
    (o.items || []).forEach(it => {
      const iRemShip = Math.max(0, (+it.ordered || 0) - (+it.shipped || 0));
      const iShipCls = iRemShip <= 0 ? 'val-zero' : ((+o.paid || 0) > 0.001 ? 'val-neg' : '');
      rows.push(`
        <tr class="item-row">
          <td>${esc(it.name)}</td>
          <td colspan="3" style="color:var(--text3)">—</td>
          <td>${fmt(it.ordered, 0)}</td>
          <td>${fmt(it.shipped, 0)}</td>
          <td class="${iShipCls}">${fmt(iRemShip, 0)}</td>
        </tr>`);
    });
  });

  document.getElementById('body').innerHTML = `
    <div class="tree-wrap">
      <table class="tree-tbl">
        <thead><tr>
          <th><span class="ord-cell"><span class="chev hidden">▶</span><span class="ord-date th-sort" data-sortkey="date">Дата${_sortArrow('date')}</span><span class="ord-num th-sort" data-sortkey="num">Замовлення${_sortArrow('num')}</span><span class="ord-client th-sort" data-sortkey="client">Клієнт / Товар${_sortArrow('client')}</span></span></th>
          <th class="th-sort" data-sortkey="amount">Сума документа${_sortArrow('amount')}</th>
          <th class="th-sort" data-sortkey="paid">Оплачено${_sortArrow('paid')}</th>
          <th class="th-sort" data-sortkey="rempay">Залишилось${_sortArrow('rempay')}</th>
          <th class="th-sort" data-sortkey="ordered">Замовлено${_sortArrow('ordered')}</th>
          <th class="th-sort" data-sortkey="shipped">Відвантажено${_sortArrow('shipped')}</th>
          <th class="th-sort" data-sortkey="remship">Залишилось відвант.${_sortArrow('remship')}</th>
        </tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>
    </div>`;
  bindRows();
}

function bindRows() {
  document.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.key;
      if (state.openKeys.has(k)) state.openKeys.delete(k);
      else state.openKeys.add(k);
      render();
    });
  });
}
</script>
</body>
</html>
